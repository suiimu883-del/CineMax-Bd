<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CineMax - Movies, Drama & Anime</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#080808;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
}

/* ===== HEADER ===== */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:#050505;
    padding:15px 5%;
    display:flex;
    align-items:center;
    gap:25px;
    border-bottom:1px solid #222;
}

.logo{
    color:#e50914;
    font-size:28px;
    font-weight:900;
}

nav{
    display:flex;
    gap:18px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
}

nav a:hover{
    color:#e50914;
}

.search{
    margin-left:auto;
}

.search input{
    width:220px;
    padding:10px 14px;
    border:1px solid #444;
    border-radius:5px;
    background:#181818;
    color:#fff;
    outline:none;
}

/* ===== HERO ===== */

.hero{
    min-height:70vh;
    display:flex;
    align-items:flex-end;
    padding:70px 5%;

    background:
    linear-gradient(to top,#080808 5%,transparent 75%),
    linear-gradient(to right,#080808 5%,transparent 80%),
    url("https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=1800&q=80")
    center/cover no-repeat;
}

.hero-content{
    max-width:600px;
}

.hero h1{
    font-size:60px;
    color:#e50914;
    margin-bottom:15px;
}

.hero p{
    color:#ddd;
    font-size:17px;
    line-height:1.6;
    margin-bottom:22px;
}

.btn{
    padding:12px 22px;
    border:none;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer;
}

.watch{
    background:#e50914;
    color:#fff;
}

.info{
    background:#fff;
    color:#000;
    margin-left:8px;
}

/* ===== SECTION ===== */

.section{
    padding:35px 5%;
}

.section h2{
    margin-bottom:20px;
    font-size:24px;
}

/* ===== CONTENT GRID ===== */

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
    gap:18px;
}

.card{
    background:#151515;
    border-radius:7px;
    overflow:hidden;
    transition:.3s;
}

.card:hover{
    transform:scale(1.04);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.card-info{
    padding:12px;
}

.title{
    font-size:16px;
    font-weight:bold;
    margin-bottom:7px;
}

.meta{
    color:#999;
    font-size:12px;
}

.card button{
    width:100%;
    margin-top:10px;
    padding:9px;
    border:0;
    border-radius:4px;
    background:#e50914;
    color:#fff;
    cursor:pointer;
}

/* ===== PLAYER ===== */

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:2000;
    background:rgba(0,0,0,.95);
    padding:20px;
    overflow:auto;
}

.modal-box{
    max-width:900px;
    margin:40px auto;
    background:#111;
    padding:20px;
    border-radius:8px;
}

.close{
    float:right;
    font-size:28px;
    cursor:pointer;
}

video{
    width:100%;
    margin-top:20px;
    background:#000;
}

/* ===== FOOTER ===== */

footer{
    text-align:center;
    padding:40px 5%;
    margin-top:30px;
    border-top:1px solid #222;
    color:#888;
}

/* ===== MOBILE ===== */

@media(max-width:700px){

    header{
        flex-wrap:wrap;
        gap:12px;
    }

    nav{
        width:100%;
        overflow-x:auto;
        order:3;
        padding-bottom:5px;
    }

    .search{
        width:100%;
        margin-left:0;
    }

    .search input{
        width:100%;
    }

    .hero{
        min-height:65vh;
        padding:50px 5%;
    }

    .hero h1{
        font-size:42px;
    }

    .hero p{
        font-size:15px;
    }

    .grid{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .card img{
        height:220px;
    }

    .section{
        padding:25px 4%;
    }
}
</style>
</head>


<body>

<!-- ================= HEADER ================= -->

<header>

    <div class="logo">CineMax</div>

    <nav>
        <a href="#home">Home</a>
        <a href="#movies">Movies</a>
        <a href="#drama">Drama</a>
        <a href="#anime">Anime</a>
    </nav>

    <div class="search">
        <input
            id="searchInput"
            type="search"
            placeholder="Search movies..."
            onkeyup="searchContent()"
        >
    </div>

</header>

<section class="hero" id="home">

    <div class="hero-content">

        <h1>CineMax</h1>

        </p>

        <button
            class="btn watch"
            onclick="openPlayer('Featured Content')"
        >
            ▶ Watch Now
        </button>

        <button
            class="btn info"
            onclick="showInfo()"

            ⓘ More Info
        </button>

    </div>

</section>

                <div class="title">

                </div>

                <button

                >
                    ▶ Watch
                </button>

            </div>

        </div>

    </div>

</section>

    <h2>🎭 Drama</h2>

    <div class="grid">

        <div class="card content"
